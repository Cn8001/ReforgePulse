<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F27"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3FF"/>
      <stop offset="1" stop-color="#0A6CFF"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M64 0 V64 M0 64 H64" stroke="#3A4656" stroke-width="2" fill="none"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><path d="M208 64 H960 V816 L816 960 H64 V208 Z"/></clipPath>
  </defs>

  <!-- Cut corners read as hardware, not an app-store bubble. -->
  <path d="M208 64 H960 V816 L816 960 H64 V208 Z" fill="url(#plate)"/>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#grid)" opacity=".55"/>
    <path d="M64 512 H960" stroke="#3A4656" stroke-width="4"/>

    <!-- The trace enters low and leaves high: the PC coming back stronger. -->
    <g fill="none" stroke-linejoin="miter" stroke-linecap="square">
      <path d="M64 576 H224 L256 544 L288 576 H320 L344 640 L376 576" stroke="#2BD4FF" stroke-width="28" filter="url(#glow)" opacity=".7"/>
      <path d="M64 576 H224 L256 544 L288 576 H320 L344 640 L376 576" stroke="#2BD4FF" stroke-width="20"/>
      <path d="M648 448 L680 384 L704 448 H736 L768 416 L800 448 H960" stroke="#2BD4FF" stroke-width="28" filter="url(#glow)" opacity=".7"/>
      <path d="M648 448 L680 384 L704 448 H736 L768 416 L800 448 H960" stroke="#2BD4FF" stroke-width="20"/>
    </g>

    <path d="M592 128 L352 576 H496 L432 896 L672 448 H528 Z" fill="#0A6CFF" filter="url(#glow)" opacity=".6"/>
    <path d="M592 128 L352 576 H496 L432 896 L672 448 H528 Z" fill="url(#bolt)"/>
    <path d="M592 128 L352 576 H496" fill="none" stroke="#C9EEFF" stroke-width="6" stroke-linejoin="miter"/>
  </g>

  <!-- HUD corner ticks. -->
  <g fill="none" stroke="#7FA6C9" stroke-width="12" stroke-linecap="square">
    <path d="M864 128 H896 V160"/>
    <path d="M128 864 V896 H160"/>
  </g>
  <path d="M208 64 H960 V816 L816 960 H64 V208 Z" fill="none" stroke="#56677D" stroke-width="8"/>
</svg>
